<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reacción completa — LIRYA</title>
  <meta name="robots" content="noindex,follow" />
  <style>
    body{margin:0;font-family:Georgia,serif;background:#0b1026;color:#fff;padding:22px}
    .wrap{max-width:900px;margin:0 auto}
    .top{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
    h1{color:#f2c98a;margin:0}
    p{opacity:.9;line-height:1.6;margin:10px 0 0}
    video{width:100%;border-radius:18px;margin:16px 0;background:#000}
    .cta{display:flex;gap:10px;flex-wrap:wrap}
    .btn{
      display:inline-block;
      color:#fff;text-decoration:none;
      padding:12px 16px;border-radius:999px;
      font-family:"Playfair Display",serif;
    }
    .btn-primary{background:linear-gradient(135deg,#ff9f3f,#e58b2a)}
    .btn-ghost{background:rgba(255,255,255,.14)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1>Reacción completa</h1>
      <div class="cta">
        <a class="btn btn-primary" href="/#formulario-lirya">Crear mi canción</a>
        <a class="btn btn-ghost" href="/">Volver</a>
      </div>
    </div>

    <p>Aquí puedes ver la reacción completa al escuchar su canción por primera vez.</p>

    <video controls playsinline preload="metadata" poster="/video3.jpg">
      <source src="/video3.mp4" type="video/mp4">
    </video>
  </div>
</body>
</html>
