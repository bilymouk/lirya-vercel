<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago cancelado – Lirya</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Montserrat', sans-serif;
      color: #e0e0e0;
      background: #0a0a0a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #ffffff;
      padding: 0.4rem 2rem;
      border-bottom: 1px solid rgba(212,165,116,.15);
    }
    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
    }
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(135deg,#d4a574,#e8c896,#d4a574);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
    }
    .background-animation {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }
    .wave {
      position: absolute;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(212,165,116,.035) 1px, transparent 1px);
      background-size: 50px 50px;
      animation: wave 22s linear infinite;
    }
    @keyframes wave {
      from { transform: translate(0,0); }
      to { transform: translate(-50%,-50%); }
    }
    .cancel-container {
      position: relative;
      z-index: 1;
      max-width: 620px;
      width: 100%;
      background: rgba(20,20,20,.96);
      border: 1px solid rgba(212,165,116,.25);
      border-radius: 14px;
      padding: 3rem 2.5rem;
      text-align: center;
      box-shadow: 0 15px 50px rgba(0,0,0,.6);
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      margin-bottom: 1rem;
      background: linear-gradient(135deg,#d4a574,#e8c896,#d4a574);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .msg {
      font-size: 1.05rem;
      color: #b8b8b8;
      line-height: 1.8;
      margin-bottom: 1.8rem;
    }
    .btns {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-block;
      padding: 0.95rem 2rem;
      border-radius: 8px;
      font-weight: 700;
      text-decoration: none;
      transition: .3s;
    }
    .btn.primary {
      background: linear-gradient(135deg,#ff6b35,#ff8c42);
      color: #fff;
      box-shadow: 0 6px 20px rgba(255,107,53,.35);
    }
    .btn.primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 26px rgba(255,107,53,.45);
    }
    .btn.secondary {
      background: rgba(255,255,255,.12);
      color: #fff;
      border: 1px solid rgba(255,255,255,.15);
    }
    .btn.secondary:hover { transform: translateY(-2px); }
    footer {
      padding: 1.5rem;
      text-align: center;
      color: #808080;
      font-size: .9rem;
      border-top: 1px solid rgba(212,165,116,.15);
    }
    .debug {
      margin-top: 16px;
      font-size: .85rem;
      color: #7a7a7a;
      font-family: monospace;
      word-break: break-all;
    }
  </style>

  <!-- ===== META PIXEL (NO PageView aquí: lo disparamos con eventID) ===== -->
  <script>
  !function(f,b,e,v,n,t,s)
  {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};
  if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
  n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];
  s.parentNode.insertBefore(t,s)}(window, document,'script',
  'https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', '893462606511287');
  fbq('set', 'autoConfig', 'false', '893462606511287');
  </script>

  <noscript>
    <img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=893462606511287&ev=PageView&noscript=1"/>
  </noscript>
</head>

<body>
<div class="background-animation"><div class="wave"></div></div>

<header>
  <div class="header-content">
    <div class="logo">LIRYA</div>
  </div>
</header>

<main>
  <div class="cancel-container">
    <h1>Pago cancelado</h1>

    <p class="msg">
      No pasa nada. No se ha realizado ningún cargo.<br>
      Si quieres, puedes volver y terminar el pedido cuando estés listo.
    </p>

    <div class="btns">
      <a href="/#formulario-lirya" class="btn primary">Volver al formulario</a>
      <a href="/" class="btn secondary">Ir al inicio</a>
    </div>

    <div class="debug" id="debug"></div>
  </div>
</main>

<footer>
  © 2024 Lirya · Todos los derechos reservados
</footer>

<script>
/* ===== TRACKER MINI (usa tu endpoint /api/meta-capi igual que el hero) ===== */
(function () {
  const hasFbq = typeof window.fbq === "function";

  const urlParams = new URLSearchParams(location.search);
  const TEST_EVENT_CODE = urlParams.get("test_event_code") || "";
  const DEBUG = urlParams.get("debug_meta") === "1";
  const log = (...args) => { if (DEBUG) console.log("[META]", ...args); };

  const getCookie = (name) => {
    const m = document.cookie.match(new RegExp("(^| )" + name + "=([^;]+)"));
    return m ? decodeURIComponent(m[2]) : null;
  };

  const setCookie = (name, value, days) => {
    const maxAge = days * 24 * 60 * 60;
    document.cookie =
      `${encodeURIComponent(name)}=${encodeURIComponent(value)}; Max-Age=${maxAge}; Path=/; SameSite=Lax; Secure`;
  };

  const newEventId = () => {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "ev_" + Date.now() + "_" + Math.random().toString(16).slice(2);
  };

  function ensureFbp() {
    let fbp = getCookie("_fbp");
    if (fbp) return fbp;
    const ts = Date.now();
    const rnd = Math.floor(Math.random() * 1e10);
    fbp = `fb.1.${ts}.${rnd}`;
    setCookie("_fbp", fbp, 90);
    return fbp;
  }

  function ensureFbc() {
    const existing = getCookie("_fbc");
    if (existing) return existing;

    const fbclid = urlParams.get("fbclid");
    if (!fbclid) return null;

    const ts = Date.now();
    const fbc = `fb.1.${ts}.${fbclid}`;
    setCookie("_fbc", fbc, 90);
    return fbc;
  }

  const FBP = ensureFbp();
  const FBC = ensureFbc();

  async function sendCapiEvent(body) {
    const url = "/api/meta-capi";
    const payload = JSON.stringify(body);

    try {
      if (navigator.sendBeacon) {
        const blob = new Blob([payload], { type: "application/json" });
        const ok = navigator.sendBeacon(url, blob);
        if (ok) { log("CAPI sendBeacon OK"); return true; }
      }
    } catch (e) { log("CAPI sendBeacon error", e); }

    try {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        keepalive: true,
        body: payload,
      });

      if (DEBUG) {
        const txt = await res.text().catch(() => "");
        log("CAPI", res.ok ? "OK" : "FAIL", res.status, txt.slice(0, 300));
      }
      return res.ok;
    } catch (e) {
      log("CAPI fetch error", e);
      return false;
    }
  }

  const once = (key, fn) => {
    try {
      if (sessionStorage.getItem(key)) return;
      sessionStorage.setItem(key, "1");
    } catch (_e) {}
    fn();
  };

  function trackEvent(eventName, customData = {}, opts = {}) {
    opts = opts || {};
    customData = customData || {};

    const eventId =
      opts.eventId ||
      opts.event_id ||
      customData.event_id ||
      newEventId();

    const event_source_url =
      opts.event_source_url ||
      (window.location.origin + window.location.pathname);

    const mergedUserData = {
      ...(customData.user_data || {}),
      ...(opts.user_data || {}),
    };

    const cleanCustomData = { ...customData };
    delete cleanCustomData.user_data;

    if (hasFbq) {
      try { window.fbq("track", eventName, cleanCustomData, { eventID: eventId }); } catch(_) {}
    }

    const capiBody = {
      event_name: eventName,
      event_time: Math.floor(Date.now() / 1000),
      event_id: eventId,
      event_source_url,
      action_source: "website",
      fbp: FBP || undefined,
      fbc: FBC || undefined,
      user_data: {
        fbp: FBP || undefined,
        fbc: FBC || undefined,
        client_user_agent: navigator.userAgent || undefined,
        ...mergedUserData,
      },
      custom_data: cleanCustomData,
      ...(TEST_EVENT_CODE ? { test_event_code: TEST_EVENT_CODE } : {}),
    };

    sendCapiEvent(capiBody);
    return eventId;
  }

  // ===== CANCEL EVENT =====
  const debugEl = document.getElementById("debug");

  let checkoutEventId = "";
  try { checkoutEventId = sessionStorage.getItem("lirya_checkout_event_id") || ""; } catch(_) {}

  // Usamos el mismo event_id si existe (dedupe y trazabilidad)
  const eventIdToUse = checkoutEventId || newEventId();

  once("lirya_cancel_fired_" + eventIdToUse, () => {
    trackEvent("CancelCheckout", { reason: "user_cancelled" }, { eventId: eventIdToUse });

    if (debugEl) {
      debugEl.textContent = "Cancel event_id: " + eventIdToUse;
    }
  });

  // ===== CLEANUP =====
  try { sessionStorage.removeItem("lirya_checkout_event_id"); } catch(_) {}
  try { sessionStorage.removeItem("lirya_purchase_value"); } catch(_) {}
  try { sessionStorage.removeItem("lirya_purchase_plan"); } catch(_) {}
})();
</script>

</body>
</html>
